# Deploys the site to Cloudflare Workers: build dist/ with tools/build_cf.py, draw the social cards into dist/og/ with
# tools/render_og.mjs (only changed cards are redrawn; the rest come from actions/cache), then wrangler deploy
# (static assets plus cf/worker.js for /api/og and /api/contracts).
# Vercel Hobby paused the account on Nov 20, 2026, so Cloudflare serves plainstatsnfl.com.
# Runs on every push to main, and after each nflverse refresh run (its pushes use GITHUB_TOKEN, which never starts a
# push-triggered workflow). Needs repo secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and
# CLOUDFLARE_ACCOUNT_ID.
name: Cloudflare deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["nflverse refresh"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the card renderer (@vercel/og)
        run: npm install --no-save --no-audit --no-fund
      - name: Restore drawn social cards
        uses: actions/cache@v4
        with:
          path: .og-cache
          key: og-cards-${{ github.run_id }}
          restore-keys: og-cards-
      - name: Build dist/
        run: python3 -I tools/build_cf.py
      - name: Draw social cards into dist/og/
        run: node tools/render_og.mjs dist .og-cache
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy
