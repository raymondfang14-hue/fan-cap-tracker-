# Deploys the site to Cloudflare Workers (static assets): build dist/ with tools/build_cf.py, then wrangler deploy.
# Vercel Hobby paused the account on Nov 20, 2026, so Cloudflare serves plainstatsnfl.com.
# Runs on every push to main, and after each nflverse refresh run (its pushes use GITHUB_TOKEN, which never starts a
# push-triggered workflow). Needs repo secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and
# CLOUDFLARE_ACCOUNT_ID.
name: Cloudflare deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["nflverse refresh"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build dist/
        run: python3 -I tools/build_cf.py
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.20.0 deploy
